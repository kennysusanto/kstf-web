services:
    proxy:
        image: traefik:v3.4
        command:
            - --providers.docker=true
            - --providers.docker.exposedbydefault=false
            - --entrypoints.web.address=:80
        ports:
            - "${TRAEFIK_HTTP_PORT:-80}:80"
        volumes:
            - /var/run/docker.sock:/var/run/docker.sock:ro
        restart: unless-stopped

    web:
        build:
            context: ./
            target: final
        environment:
            PORT: ${PORT:-5172}
            MYSQL_HOST: mysql
            MYSQL_USER: ${MYSQL_USER:-kstf_web}
            MYSQL_PASSWORD: ${MYSQL_PASSWORD}
            MYSQL_DB: ${MYSQL_DATABASE:-kstf_web}
        depends_on:
            mysql:
                condition: service_healthy
        restart: unless-stopped
        labels:
            traefik.enable: "true"
            traefik.http.routers.web.rule: Host(`${TRAEFIK_HOST:-localhost}`)
            traefik.http.routers.web.entrypoints: web
            traefik.http.services.web.loadbalancer.server.port: "5172"
        healthcheck:
            test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:' + (process.env.PORT || '5172') + '/api').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 20s
        volumes:
            - kstf-web-model-data:/usr/local/kstf-web/src/public/model
            - kstf-web-dataset-data:/usr/local/kstf-web/src/public/dataset

    mysql:
        image: mysql:9.3
        volumes:
            - kstf-web-mysql-data:/var/lib/mysql
        environment:
            MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
            MYSQL_DATABASE: ${MYSQL_DATABASE:-kstf_web}
            MYSQL_USER: ${MYSQL_USER:-kstf_web}
            MYSQL_PASSWORD: ${MYSQL_PASSWORD}
        restart: unless-stopped
        healthcheck:
            test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -p$$MYSQL_ROOT_PASSWORD"]
            interval: 10s
            timeout: 5s
            retries: 10
            start_period: 20s

    phpmyadmin:
        image: phpmyadmin:5.2
        profiles:
            - debug
        ports:
            - "82:80"
        environment:
            PMA_HOST: mysql
            PMA_USER: root
            PMA_PASSWORD: ${MYSQL_ROOT_PASSWORD}
        depends_on:
            mysql:
                condition: service_healthy

volumes:
    kstf-web-mysql-data:
    kstf-web-model-data:
    kstf-web-dataset-data:
