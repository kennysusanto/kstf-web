services:
  nginx:
    image: nginx:1.27-alpine
    depends_on:
      backend-1:
        condition: service_healthy
      backend-2:
        condition: service_healthy
      client-1:
        condition: service_healthy
      client-2:
        condition: service_healthy
    ports:
      - "${NGINX_HTTP_PORT:-8080}:80"
    volumes:
      - ./nginx/roundrobin.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

  backend-1:
    build:
      context: ./
      target: backend-base
    command: ["node", "src/index.js"]
    environment:
      PORT: ${PORT:-5172}
      MYSQL_HOST: mysql
      MYSQL_USER: ${MYSQL_USER:-kstf_web}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DB: ${MYSQL_DATABASE:-kstf_web}
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:' + (process.env.PORT || '5172') + '/api').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    volumes:
      - kstf-web-model-data:/usr/local/kstf-web/src/public/model
      - kstf-web-dataset-data:/usr/local/kstf-web/src/public/dataset

  backend-2:
    build:
      context: ./
      target: backend-base
    command: ["node", "src/index.js"]
    environment:
      PORT: ${PORT:-5172}
      MYSQL_HOST: mysql
      MYSQL_USER: ${MYSQL_USER:-kstf_web}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DB: ${MYSQL_DATABASE:-kstf_web}
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:' + (process.env.PORT || '5172') + '/api').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    volumes:
      - kstf-web-model-data:/usr/local/kstf-web/src/public/model
      - kstf-web-dataset-data:/usr/local/kstf-web/src/public/dataset

  client-1:
    build:
      context: ./
      target: client-prod
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "process.env.NODE_TLS_REJECT_UNAUTHORIZED='0'; fetch('https://127.0.0.1:5173/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  client-2:
    build:
      context: ./
      target: client-prod
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "process.env.NODE_TLS_REJECT_UNAUTHORIZED='0'; fetch('https://127.0.0.1:5173/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  mysql:
    image: mysql:9.3
    volumes:
      - kstf-web-mysql-data:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-kstf_web}
      
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  kstf-web-mysql-data:
  kstf-web-model-data:
  kstf-web-dataset-data:
